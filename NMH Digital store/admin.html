
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1530">

  <title>K7 Digital Store | Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Inter", "Noto Sans Myanmar", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(29,107,255,.25), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(0,194,255,.15), transparent 35%),
        #0b1530;
      color: #fff;
      overflow-x: hidden;
    }

    .background-circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    .circle-one {
      width: 260px;
      height: 260px;
      background: rgba(28,104,255,.12);
      top: -80px;
      right: -60px;
    }

    .circle-two {
      width: 220px;
      height: 220px;
      background: rgba(0,190,255,.10);
      bottom: -80px;
      left: -50px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .admin-login {
      width: 100%;
      padding: 38px 32px;
      border-radius: 24px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    /* K7 Logo */
    .logo {
      width: 112px;
      height: 112px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
      overflow: hidden;
      background: #fff;
      border: 2px solid rgba(255,255,255,.25);
      box-shadow: 0 10px 35px rgba(0,120,255,.3);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .admin-login h2 {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.5px;
      margin-bottom: 9px;
    }

    .subtitle {
      text-align: center;
      color: #aab8d3;
      font-size: 13px;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      color: #dce6f8;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .input-group input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      outline: none;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.07);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      transition: .25s;
    }

    .input-group input::placeholder {
      color: #8190aa;
    }

    .input-group input:focus {
      border-color: #398bff;
      background: rgba(255,255,255,.10);
      box-shadow: 0 0 0 3px rgba(57,139,255,.13);
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#287cff,#0870ed);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: .25s;
      box-shadow: 0 8px 25px rgba(27,111,255,.25);
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(27,111,255,.4);
    }

    .login-button:active {
      transform: scale(.98);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #ff7777;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .security-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 23px;
      color: #8797b4;
      font-size: 11px;
    }

    .security-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #20d69b;
      box-shadow: 0 0 10px rgba(32,214,155,.6);
    }

    .footer {
      text-align: center;
      color: #667795;
      font-size: 11px;
      margin-top: 22px;
    }

    @media (max-width: 480px) {
      .admin-login {
        padding: 32px 23px;
        border-radius: 20px;
      }

      .admin-login h2 {
        font-size: 21px;
      }

      .logo {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <div class="background-circle circle-one"></div>
  <div class="background-circle circle-two"></div>

  <main class="login-wrapper">

    <div class="admin-login">

      <div class="logo">
        <img src="k7-logo.png" alt="K7 Digital Store Logo">
      </div>

      <h2>K7 Digital Store</h2>

      <p class="subtitle">
        Admin Dashboard Login<br>
        Admin Account ဖြင့် Login ဝင်ပါ
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your admin email"
            autocomplete="username"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-button">
          Login to Dashboard →
        </button>

        <p id="message"></p>

      </form>

      <div class="security-note">
        <span class="security-dot"></span>
        Secure Admin Access
      </div>

    </div>

    <div class="footer">
      © 2026 K7 Digital Store. All rights reserved.
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>

</body>
</html>
